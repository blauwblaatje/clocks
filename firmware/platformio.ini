; One firmware per board; everything but src/board_<name>.cpp is shared
; (src/board.h). Both compile; neither has run on hardware yet.
;   c6         Waveshare ESP32-C6-Touch-LCD-1.28 (240 x 240)
;   stopwatch  M5Stack StopWatch, ESP32-S3R8 (466 x 466 AMOLED)
; The pioarduino platform fork (Arduino core 3.x) is needed for the C6: the
; stock espressif32 platform has no Arduino support for it. Pinned release,
; and PlatformIO Core 6.2.0 exactly (HANDOVER section 0).
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; two app slots for updates with rollback (HANDOVER section 8)
board_build.partitions = default_16MB.csv
lib_deps =
    lvgl/lvgl@9.2.2
    ; display drivers (GC9A01, CO5300); Waveshare's own example uses 1.6.4,
    ; which does not build with the Arduino core 3.3 in this platform
    moononournation/GFX Library for Arduino@1.6.9
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
; host tests are built with g++ directly (see README), not by PlatformIO
test_ignore = *

; Waveshare ESP32-C6-Touch-LCD-1.28 has no PlatformIO board file; the C6
; DevKitC-1 one is used with the board's 16 MB flash.
[env:c6]
board = esp32-c6-devkitc-1
build_src_filter = +<*> -<board_*.cpp> +<board_common.cpp> +<board_waveshare_c6.cpp>

; M5Stack StopWatch: no PlatformIO board file either; the S3 DevKitC-1 one
; with 16 MB flash and the 8 MB octal PSRAM (M5Stack's own example uses the
; same memory settings). Power and the button at the top go through the
; M5PM1 power chip (its library, MIT).
[env:stopwatch]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
lib_deps =
    ${env.lib_deps}
    https://github.com/m5stack/M5PM1.git#1.0.7
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DCLOCK_DISPLAY_466
build_src_filter = +<*> -<board_*.cpp> +<board_common.cpp> +<board_m5_stopwatch.cpp>
