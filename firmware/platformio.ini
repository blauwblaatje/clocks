; ESP32-C6 needs the pioarduino platform fork (Arduino core 3.x); the stock
; espressif32 platform has no Arduino support for the C6. Pinned release.
; Board: Waveshare ESP32-C6-Touch-LCD-1.28 has no PlatformIO board file;
; the C6 DevKitC-1 one is used with the board's 16 MB flash.
; Compiles (2026-11-10); never run on hardware.
[env:c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; two app slots for updates with rollback (HANDOVER section 8)
board_build.partitions = default_16MB.csv
lib_deps =
    lvgl/lvgl@9.2.2
    ; display driver, as in Waveshare's own Arduino example for this board (they use 1.6.4,
    ; which does not build with the Arduino core 3.3 in this platform)
    moononournation/GFX Library for Arduino@1.6.9
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
; host tests are built with g++ directly (see README), not by PlatformIO
test_ignore = *
